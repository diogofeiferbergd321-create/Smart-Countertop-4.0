<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HUD Industrial</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ====== BASE ====== */
* { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', Arial, sans-serif; }
body { 
    background: radial-gradient(circle at center, #02121f 0%, #00070d 100%);
    color: #d9faff; 
    overflow-x: hidden;
}
button, input { font-family: inherit; }

/* ====== LOGIN ====== */
#loginPage, #dashboardPage {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    transition: opacity 0.5s ease;
}
.container {
    background: rgba(0,20,40,0.7);
    padding: 50px 40px;
    border-radius: 25px;
    border: 4px solid #00eaff;
    box-shadow: 0 0 40px #00eaff88;
    width: 90%;
    max-width: 500px;
    text-align: center;
    animation: pulseBorder 3s infinite alternate;
}
@keyframes pulseBorder {
    0% { border-color: #00eaff; box-shadow: 0 0 35px #00eaff88; }
    50% { border-color: #00ffaa; box-shadow: 0 0 50px #00ffaa88; }
    100% { border-color: #00eaff; box-shadow: 0 0 35px #00eaff88; }
}
.container h1 { text-shadow:0 0 16px #00eaff; margin-bottom:25px; font-size:32px; }
input {
    width: 100%; padding:16px; margin:14px 0;
    border-radius: 20px; border: 3px solid #00eaff;
    background: rgba(0,30,50,0.5); color: #d9faff; font-size:18px;
    transition: 0.3s;
}
input:focus { outline:none; border-color:#00ffaa; box-shadow:0 0 20px #00ffaa88; }
button {
    width: 100%; padding:18px; margin-top:12px;
    border-radius:20px; border:4px solid #00eaff;
    background: rgba(0,255,255,0.2); color:#00eaff;
    font-size:20px; cursor:pointer; transition:0.25s; text-shadow:0 0 14px #00eaff;
}
button:hover { background: rgba(0,255,255,0.45); box-shadow:0 0 25px #00eaff; transform:scale(1.06); }
.toggle-view { margin-top:15px; font-size:16px; color:#00ffaa; cursor:pointer; text-decoration:underline; }

/* ====== DASHBOARD ====== */
#dashboardPage { display:none; flex-direction: column; padding:40px; width:100%; max-width:1400px; }
h1 { text-shadow:0 0 16px #00eaff; font-size:38px; margin-bottom:30px; }
h2 { text-shadow:0 0 14px #00eaff; font-size:28px; margin-bottom:15px; }

.card {
    background: rgba(0,30,50,0.28);
    padding: 30px;
    border-radius: 20px;
    border: 4px solid #00eaff55;
    box-shadow: 0 0 25px #00eaff55;
    backdrop-filter: blur(14px);
    margin-bottom: 50px;
    width: 100%;
    transition: 0.3s;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 0 45px #00eaff77; }

/* ====== GRIDS ====== */
.estoque-grid, .expedicao-grid { display: grid; gap:15px; margin-top:15px; }
.estoque-grid { grid-template-columns: repeat(auto-fit,minmax(70px,1fr)); }
.expedicao-grid { grid-template-columns: repeat(auto-fit,minmax(100px,1fr)); }

.posicao, .exp {
    height:80px; display:flex; justify-content:center; align-items:center;
    border-radius:15px; font-weight:bold; cursor:pointer; user-select:none;
    border:3px solid #00eaff;
    transition:0.3s; text-shadow:0 0 8px #00eaff; font-size:18px;
}
.posicao:hover, .exp:hover { box-shadow:0 0 35px #00eaff; transform:scale(1.08); }
.vermelho { background:#b00000; color:#fff; }
.azul { background:#0044ff; color:#fff; }
.preto { background:#111; color:#fff; }
.vazio { background:#333; color:#aaa; }
.exp.oco { background:#222; color:#777; }

/* ====== GRAFICOS ====== */
canvas { 
    margin-top:25px; 
    border:3px solid #00eaff; 
    border-radius:15px; 
    background:rgba(0,0,20,0.4); 
    width: 100% !important; 
    height: 350px !important; 
    box-sizing:border-box;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="container">
        <h1 id="title">Login</h1>
        <input type="text" id="nome" placeholder="Nome">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="action()">Entrar</button>
        <div class="toggle-view" onclick="toggleView()">Não tem conta? Cadastre-se</div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">
    <h1>HUD Industrial - Dashboard</h1>

    <!-- ESTOQUE -->
    <div class="card">
        <h2>Estoque</h2>
        <div id="estoque" class="estoque-grid"></div>
    </div>

    <!-- EXPEDIÇÃO -->
    <div class="card">
        <h2>Expedição</h2>
        <div id="expedicoes" class="expedicao-grid"></div>
    </div>

    <!-- GRAFICOS -->
    <div class="card">
        <h2>Dados do Processo</h2>
        <canvas id="chartTemp"></canvas>
        <canvas id="chartVars"></canvas>
    </div>
</div>

<script>
/* ====== USUARIOS ====== */
let users = JSON.parse(localStorage.getItem("usuarios") || "[]");
let isLogin = true;

function toggleView() {
    isLogin = !isLogin;
    document.getElementById("title").innerText = isLogin ? "Login" : "Cadastro";
    document.querySelector("button").innerText = isLogin ? "Entrar" : "Cadastrar";
    document.querySelector(".toggle-view").innerText = isLogin ? "Não tem conta? Cadastre-se" : "Já tem conta? Faça login";
    document.getElementById("nome").value = "";
    document.getElementById("senha").value = "";
}

function action() {
    const nome = document.getElementById("nome").value.trim();
    const senha = document.getElementById("senha").value.trim();
    if(!nome || !senha){ alert("Preencha nome e senha!"); return; }

    if(isLogin){
        const user = users.find(u => u.nome === nome && u.senha === senha);
        if(user){
            document.getElementById("loginPage").style.display="none";
            document.getElementById("dashboardPage").style.display="flex";
            initDashboard();
        } else {
            alert("Nome ou senha incorretos!");
        }
    } else {
        if(users.find(u=>u.nome===nome)){ alert("Nome já existe!"); return; }
        users.push({nome,senha});
        localStorage.setItem("usuarios", JSON.stringify(users));
        alert("Usuário cadastrado!");
        toggleView();
    }
}

/* ====== DASHBOARD ====== */
function initDashboard(){
    // ESTOQUE
    const estoque = document.getElementById("estoque");
    const cores = ["vermelho","azul","preto","vazio"];
    estoque.innerHTML="";
    for(let i=1;i<=28;i++){
        let c = cores[Math.floor(Math.random()*4)];
        let d = document.createElement("div");
        d.className = "posicao "+c;
        d.innerHTML=i;
        d.title = "Clique para detalhes";
        d.onclick = () => alert("Posição "+i+" - Status: "+c);
        estoque.appendChild(d);
    }

    // EXPEDIÇÃO
    const exp = document.getElementById("expedicoes");
    exp.innerHTML="";
    for(let i=1;i<=12;i++){
        let p = Math.random()<0.5 ? null : Math.floor(Math.random()*9000+1000);
        let d = document.createElement("div");
        d.className = "exp "+(p?"":"oco");
        d.innerHTML = p?"Pedido "+p:"Vazio";
        d.title = p?"Clique para detalhes":"Nenhum pedido";
        d.onclick = ()=>alert("Expedição "+(p||"vazio"));
        exp.appendChild(d);
    }

    // GRAFICOS
    const ctxTemp = document.getElementById("chartTemp").getContext('2d');
    const chartTemp = new Chart(ctxTemp, { 
        type:"line", 
        data:{ labels:[], datasets:[{data:[], borderColor:"#00eaff", backgroundColor:"#00eaff44", tension:0.3, fill:true}]}, 
        options:{ animation:false, responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
    });
    setInterval(()=>{
        let time = new Date().toLocaleTimeString().slice(0,5);
        chartTemp.data.labels.push(time);
        chartTemp.data.datasets[0].data.push(22 + Math.random()*4);
        if(chartTemp.data.labels.length>20){ chartTemp.data.labels.shift(); chartTemp.data.datasets[0].data.shift(); }
        chartTemp.update();
    },1000);

    const ctxVars = document.getElementById("chartVars").getContext('2d');
    const chartVars = new Chart(ctxVars, {
        type:"bar",
        data:{ labels:["Tensão","Umidade","Corrente"], datasets:[{backgroundColor:["#00eaff99","#00bbff99","#00ffaa99"],data:[220,45,1.2]}]},
        options:{ animation:false, responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
    });
    setInterval(()=>{
        chartVars.data.datasets[0].data=[220+Math.random()*3,45+Math.random()*4,1+Math.random()*0.4];
        chartVars.update();
    },1000);
}
</script>
</body>
</html>
