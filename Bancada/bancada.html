<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HUD Aranhaverso</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ========================= */
/* MODO ESCURO + COMPACTO    */
/* ========================= */
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    overflow-x: hidden;
    font-size: 14px; /* texto geral menor */
}

/* ========================= */
/* LOGIN MAIS COMPACTO       */
/* ========================= */
#loginScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
}

#loginScreen .login-box {
    background: rgba(20, 20, 40, 0.85);
    padding: 25px;
    border-radius: 18px;
    border: 3px solid #ff1a1a;
    box-shadow: 0 0 15px #ff1a1a;
    text-align: center;
}

#loginScreen input {
    width: 220px;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 2px solid #ff1a1a;
    font-size: 15px;
}

#loginScreen button {
    padding: 8px 20px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #ff1a1a;
    background: #ff1a1a;
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
}
#loginScreen button:hover { background: #ff3b3b; }

/* ========================= */
/* HUD COMPACTO              */
/* ========================= */
#hud {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 240px;        /* REDUZIDO */
    padding: 15px;       /* REDUZIDO */
    background: rgba(0,0,0,0.7);
    border-radius: 14px;
    border: 3px solid #ff1a1a;
    box-shadow: 0 0 12px #ff1a1a;
    font-size: 14px;     /* REDUZIDO */
    z-index: 999;
}

.hud-item { margin: 8px 0; }

/* ========================= */
/* CARDS AINDA MENORES       */
/* ========================= */
.card {
    background: rgba(10, 10, 20, 0.8);
    padding: 10px;                /* REDUZIDO */
    border-radius: 12px;          /* REDUZIDO */
    border: 2px solid #00eaff;    /* REDUZIDO */
    box-shadow: 0 0 6px #00eaff;  /* REDUZIDO */
    margin-bottom: 14px;          /* REDUZIDO */
}

.card h2 {
    font-size: 17px;              /* TÍTULOS MENORES */
    margin-bottom: 6px;
}

/* ========================= */
/* GRID MAIS APERTADO        */
/* ========================= */
.estoque-grid, .expedicao-grid, .montagem-grid {
    display: grid;
    gap: 6px; /* menor */
}

.estoque-grid { grid-template-columns: repeat(7, 1fr); }
.expedicao-grid { grid-template-columns: repeat(6, 1fr); }
.montagem-grid { grid-template-columns: repeat(4, 1fr); }

.posicao, .exp, .mont {
    width: 45px;          /* largura igual à altura */
    height: 45px;         /* mantém tamanho igual */
    font-size: 13px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;   /* TORNA CÍRCULO */
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    border: 2px solid #fff;
    text-align: center;
}



.vermelho { background: #e43f5a; }
.azul { background: #1f4068; }
.roxo { background: #5a2d82; }
.vazio { background: #333; color: #aaa; }

/* ========================= */
/* GRÁFICOS MENORES          */
/* ========================= */
canvas {
    max-width: 380px;  /* ANTES 450 */
    max-height: 150px; /* ANTES 180 */
    margin: 10px auto;
    display: block;
}

/* BOTÃO APAGAR */
.delete-btn {
    margin-top: 10px;
    padding: 6px 14px;
    border-radius: 8px;
    border: 2px solid #ff1a1a;
    background: #ff1a1a;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}
.delete-btn:hover { background: #ff3b3b; }

main {
    padding: 15px;
    margin-left: 10px;
}

h1 {
    font-size: 22px;
    margin-bottom: 10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="nome" placeholder="Nome"><br>
        <input type="password" id="senha" placeholder="Senha"><br>
        <button onclick="login()">Entrar</button>
    </div>
</div>

<!-- HUD -->
<div id="hud">
    <div class="hud-item">Temperatura: <span id="temp">--</span> °C</div>
    <div class="hud-item">Umidade: <span id="umid">--</span> %</div>
    <div class="hud-item">Corrente: <span id="corr">--</span> A</div>
</div>

<main>
    <h1>Dashboard - Aranhaverso HUD</h1>

    <!-- GRAFICOS -->
    <div class="card">
        <h2>Gráficos do Sistema</h2>
        <canvas id="graficoTemp"></canvas>
        <canvas id="graficoUmid"></canvas>
        <canvas id="graficoCorr"></canvas>
    </div>

    <!-- ESTOQUE -->
    <div class="card">
        <h2>Estoque</h2>
        <div id="estoque" class="estoque-grid"></div>
    </div>

    <!-- EXPEDIÇÃO -->
    <div class="card">
        <h2>Expedição</h2>
        <div id="expedicoes" class="expedicao-grid"></div>
    </div>

    <!-- MONTAGEM -->
    <div class="card">
        <h2>Montagem</h2>
        <div id="montagem" class="montagem-grid"></div>
    </div>

    <button class="delete-btn" onclick="apagarCadastro()">Apagar Cadastro</button>
</main>

<script>
/* LOGIN */
function login() {
    const nome = document.getElementById('nome').value;
    const senha = document.getElementById('senha').value;

    if (!nome || !senha) { alert("Preencha todos os campos!"); return; }

    const userData = { nome, senha };
    localStorage.setItem("userData", JSON.stringify(userData));
    document.getElementById("loginScreen").style.display = "none";
}

window.onload = () => {
    if (localStorage.getItem("userData")) {
        document.getElementById("loginScreen").style.display = "none";
    }
};

/* APAGAR CADASTRO */
function apagarCadastro() {
    localStorage.removeItem("userData");
    alert("Cadastro apagado.");
    location.reload();
}

/* GRID */
function createGrid(container, count, type) {
    const cores = ["vermelho", "azul", "roxo", "vazio"];

    for (let i = 1; i <= count; i++) {
        let div = document.createElement("div");
        div.className = cores[Math.floor(Math.random()*4)] + " " + type;
        div.innerText = type === "posicao" ? i : type.toUpperCase() + " " + i;

        div.addEventListener("click", () => {
            let next = cores[(cores.indexOf(div.classList[0]) + 1) % 4];
            div.className = next + " " + type;
        });

        container.appendChild(div);
    }
}

createGrid(document.getElementById("estoque"), 28, "posicao");
createGrid(document.getElementById("expedicoes"), 12, "exp");
createGrid(document.getElementById("montagem"), 8, "mont");

/* GRÁFICOS */
let tempChart, umidChart, corrChart;

function gerarGraficos() {
    const ctxT = document.getElementById("graficoTemp");
    const ctxU = document.getElementById("graficoUmid");
    const ctxC = document.getElementById("graficoCorr");

    tempChart = new Chart(ctxT, {
        type: "line",
        data: { labels: [], datasets: [{ label: "Temperatura", borderColor: "red", data: [] }] },
        options: { responsive: true }
    });

    umidChart = new Chart(ctxU, {
        type: "line",
        data: { labels: [], datasets: [{ label: "Umidade", borderColor: "blue", data: [] }] },
        options: { responsive: true }
    });

    corrChart = new Chart(ctxC, {
        type: "line",
        data: { labels: [], datasets: [{ label: "Corrente", borderColor: "yellow", data: [] }] },
        options: { responsive: true }
    });
}

function atualizarHUD() {
    let T = (20 + Math.random()*10).toFixed(1);
    let U = (40 + Math.random()*40).toFixed(1);
    let C = (1 + Math.random()*4).toFixed(2);

    document.getElementById("temp").innerText = T;
    document.getElementById("umid").innerText = U;
    document.getElementById("corr").innerText = C;

    let timeLabel = new Date().toLocaleTimeString();

    tempChart.data.labels.push(timeLabel);
    umidChart.data.labels.push(timeLabel);
    corrChart.data.labels.push(timeLabel);

    tempChart.data.datasets[0].data.push(T);
    umidChart.data.datasets[0].data.push(U);
    corrChart.data.datasets[0].data.push(C);

    tempChart.update();
    umidChart.update();
    corrChart.update();
}

gerarGraficos();
setInterval(atualizarHUD, 2000);
</script>

</body>
</html>
