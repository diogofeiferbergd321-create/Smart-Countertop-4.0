<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HUD Aranhaverso</title>
<style>
/* ========================= */
/* BACKGROUND ARANHAVERSO    */
/* ========================= */
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #162447, #1f4068, #e43f5a);
    color: #fff;
    overflow-x: hidden;
}

/* ========================= */
/* LOGIN SCREEN              */
/* ========================= */
#loginScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
}

#loginScreen .login-box {
    background: rgba(20, 20, 40, 0.85);
    padding: 40px;
    border-radius: 25px;
    border: 4px solid #ff1a1a;
    box-shadow: 0 0 30px #ff1a1a;
    text-align: center;
    animation: loginGlow 2s infinite alternate;
}

#loginScreen input {
    width: 250px;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 2px solid #ff1a1a;
    font-size: 18px;
}

#loginScreen button {
    padding: 12px 28px;
    font-size: 18px;
    border-radius: 12px;
    border: 2px solid #ff1a1a;
    background: #ff1a1a;
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
}

#loginScreen button:hover {
    background: #ff4d4d;
}

@keyframes loginGlow {
    0% { box-shadow: 0 0 30px #ff1a1a; border-color: #ff1a1a; }
    50% { box-shadow: 0 0 50px #ffcc00; border-color: #ffcc00; }
    100% { box-shadow: 0 0 30px #ff1a1a; border-color: #ff1a1a; }
}

/* ========================= */
/* MAIN DASHBOARD            */
/* ========================= */
main {
    padding: 30px;
    margin-left: 20px;
}

/* ========================= */
/* HUD DIREITO               */
/* ========================= */
#hud {
    position: fixed;
    top: 40px;
    right: 40px;
    width: 350px;
    padding: 25px;
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    border: 5px solid #ff1a1a;
    box-shadow: 0 0 30px #ff1a1a;
    font-size: 20px;
    z-index: 999;
    animation: hudGlow 2s infinite alternate;
}

.hud-item {
    margin: 16px 0;
}

@keyframes hudGlow {
    0% { box-shadow: 0 0 30px #ff1a1a; border-color: #ff1a1a; }
    50% { box-shadow: 0 0 50px #ffcc00; border-color: #ffcc00; }
    100% { box-shadow: 0 0 30px #ff1a1a; border-color: #ff1a1a; }
}

/* ========================= */
/* CARDS                     */
/* ========================= */
.card {
    background: rgba(0, 0, 20, 0.6);
    padding: 20px;
    border-radius: 20px;
    border: 4px solid #00eaff;
    box-shadow: 0 0 20px #00eaff;
    margin-bottom: 30px;
}

/* ========================= */
/* GRID ESTOQUE & EXPEDICAO  */
/* ========================= */
.estoque-grid, .expedicao-grid, .montagem-grid {
    display: grid;
    gap: 12px;
}

.estoque-grid { grid-template-columns: repeat(7, 1fr); }
.expedicao-grid { grid-template-columns: repeat(6, 1fr); }
.montagem-grid { grid-template-columns: repeat(4, 1fr); }

.posicao, .exp, .mont {
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    border: 3px solid #fff;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { box-shadow: 0 0 6px #00eaff66; }
    to { box-shadow: 0 0 20px #00eaffdd; }
}

.vermelho { background: #e43f5a; }
.azul { background: #1f4068; }
.roxo { background: #5a2d82; }
.vazio { background: #333; color: #aaa; }

/* BOTÃO APAGAR CADASTRO */
.delete-btn {
    margin-top: 12px;
    padding: 10px 20px;
    border-radius: 10px;
    border: 2px solid #ff1a1a;
    background: #ff1a1a;
    color: #fff;
    cursor: pointer;
}
.delete-btn:hover { background: #ff4d4d; }

</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="nome" placeholder="Nome"><br>
        <input type="password" id="senha" placeholder="Senha"><br>
        <button onclick="login()">Entrar</button>
    </div>
</div>

<!-- HUD -->
<div id="hud">
    <div class="hud-item">Temperatura: <span id="temp">--</span> °C</div>
    <div class="hud-item">Umidade: <span id="umid">--</span> %</div>
    <div class="hud-item">Corrente: <span id="corr">--</span> A</div>
</div>

<main>
    <h1>Dashboard - Aranhaverso HUD</h1>

    <!-- ESTOQUE -->
    <div class="card">
        <h2>Estoque</h2>
        <div id="estoque" class="estoque-grid"></div>
    </div>

    <!-- EXPEDIÇÃO -->
    <div class="card">
        <h2>Expedição</h2>
        <div id="expedicoes" class="expedicao-grid"></div>
    </div>

    <!-- MONTAGEM -->
    <div class="card">
        <h2>Montagem</h2>
        <div id="montagem" class="montagem-grid"></div>
    </div>

    <button class="delete-btn" onclick="apagarCadastro()">Apagar Cadastro</button>
</main>

<script>
/* LOGIN SIMPLES COM LOCALSTORAGE */
function login() {
    const nome = document.getElementById('nome').value;
    const senha = document.getElementById('senha').value;
    if(!nome || !senha){ alert('Preencha nome e senha'); return; }
    localStorage.setItem('usuario', nome);
    localStorage.setItem('senha', senha);
    document.getElementById('loginScreen').style.display = 'none';
}

/* APAGAR CADASTRO */
function apagarCadastro(){
    localStorage.removeItem('usuario');
    localStorage.removeItem('senha');
    alert('Cadastro apagado!');
    location.reload();
}

/* CARREGAR CADASTRO AUTOMATICAMENTE */
window.onload = () => {
    if(localStorage.getItem('usuario')){
        document.getElementById('loginScreen').style.display = 'none';
    }
}

/* ========================= */
/* ESTOQUE */
const estoque = document.getElementById('estoque');
for(let i=1;i<=28;i++){
    let div = document.createElement('div');
    div.className = ['vermelho','azul','roxo','vazio'][Math.floor(Math.random()*4)] + " posicao";
    div.innerText = i;
    estoque.appendChild(div);
}

/* ========================= */
/* EXPEDIÇÃO */
const expedicoes = document.getElementById('expedicoes');
for(let i=1;i<=12;i++){
    let div = document.createElement('div');
    div.className = ['vermelho','azul','roxo','vazio'][Math.floor(Math.random()*4)] + " exp";
    div.innerText = "Pedido "+i;
    expedicoes.appendChild(div);
}

/* ========================= */
/* MONTAGEM */
const montagem = document.getElementById('montagem');
for(let i=1;i<=8;i++){
    let div = document.createElement('div');
    div.className = ['vermelho','azul','roxo','vazio'][Math.floor(Math.random()*4)] + " mont";
    div.innerText = "Estação "+i;
    montagem.appendChild(div);
}

/* ========================= */
/* HUD ATUALIZAÇÃO DINÂMICA */
<div id="hud">
    <div class="hud-item">Temperatura: <span id="temp">--</span> °C</div>
    <div class="hud-item">Umidade: <span id="umid">--</span> %</div>
    <div class="hud-item">Corrente: <span id="corr">--</span> A</div>
</div>

</script>

</body>
</html>
